server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck (Coolify / load balancer)
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Catálogo Fe (estático em dist/catalogo)
    location /catalogo/ {
        try_files $uri $uri/ /catalogo/index.html;
    }

    # API do catálogo → Supabase Edge Functions (same-origin no browser)
    location = /api/catalog {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sjapbromslgohlxcndrj.supabase.co;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://sjapbromslgohlxcndrj.supabase.co/functions/v1/catalogo-catalog;
    }

    location = /api/product-image {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sjapbromslgohlxcndrj.supabase.co;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://sjapbromslgohlxcndrj.supabase.co/functions/v1/catalogo-product-image;
    }

    # Cache assets com hash do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker e manifest sempre atualizados
    location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA: rotas do React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
