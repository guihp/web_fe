<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catálogo digital de produtos da Fé Representações, organizado por indústria."
    />
    <meta name="theme-color" content="#ef5a1a" />
    <title>Catálogo de Produtos | Fé Representações</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260914-access2" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>
    <div id="app"></div>

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <div class="dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M9 6V4h6v2m-8 0 1 14h8l1-14" />
          </svg>
        </div>
        <p class="eyebrow">Confirmar retirada</p>
        <h2>Retirar este produto?</h2>
        <p id="confirm-message" class="dialog-copy"></p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">Cancelar</button>
          <button class="button button-danger" id="confirm-remove" value="confirm">
            Retirar produto
          </button>
        </div>
      </form>
    </dialog>

    <noscript>
      <div class="noscript-message">
        Ative o JavaScript para consultar e gerenciar o catálogo.
      </div>
    </noscript>
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script src="app.js?v=20260914-access2" defer></script>
  </body>
</html>
